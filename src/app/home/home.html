<header class="navbar">

  <div class="logo">
    <img src="assets/Logo.png" alt="logo">
     Cyber Space Solutions
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#services">Servicios</a>
    <a href="#contact">Contacto</a>
  </nav>

</header>


<section class="hero">

  <div class="carousel">

    <div class="slide">

      <img [src]="images[current]" />

      <div class="overlay"></div>

      <div class="carousel-text">

        <h1>Soluciones Tecnológicas Integrales</h1>

        <p>
          Infraestructura, soporte y seguridad para empresas modernas
        </p>

      </div>

    </div>

    <button class="arrow left" (click)="prev()">❮</button>
    <button class="arrow right" (click)="next()">❯</button>

  </div>


  <div class="dots">

    <span
      *ngFor="let img of images; let i = index"
      [class.active]="i === current"
      (click)="goToSlide(i)">
    </span>

  </div>

</section>
